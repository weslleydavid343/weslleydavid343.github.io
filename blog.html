<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog // weslley343</title>
    <script src="js/preloader.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap"

    <link rel="stylesheet" href="css/common/global.css">

    <link rel="stylesheet" href="css/index/styles.css">
    <style>
        .blog-hero-banner {
            position: relative;
            width: 100vw;
            left: 50%;
            right: 50%;
            margin-left: -50vw;
            margin-right: -50vw;
            min-height: 280px;
            display: flex;
            align-items: center;
            border-radius: 0;
            border-left: none;
            border-right: none;
            margin-top: 0;
            border-top: none;
            border-bottom: 1px solid var(--border-color);
            background: url('assets/IMG_6301_min_grain.webp') center/cover no-repeat;
            box-shadow: 0 8px 24px rgba(60, 45, 30, 0.12);
            overflow: hidden;
        }

        .blog-hero-content {
            max-width: 960px;
            margin: 0 auto;
            padding: 0 var(--spacing-md);
            width: 100%;
        }

        @media (min-width: 768px) {
            .blog-hero-content {
                padding: 0 var(--spacing-lg);
            }
        }
    </style>
</head>

<body>
    <header class="site-header">
        <div class="header-container">
            <a href="index.html" style="text-decoration: none;">
                <span class="black-badge-title" style="font-size: 1.5rem; padding: 6px 20px; margin: 0;">WD343</span>

            <nav class="desktop-nav-links">

                <a href="logs.html" class="desktop-nav-btn">/LOGS</a>

                <a href="me.html" class="desktop-nav-btn">/SOBRE</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="hero blog-hero-banner">
            <div class="blog-hero-content">
                <h1 class="black-badge-title">BLOG</h1>
                <div>
                    <p class="black-badge-subtitle">artigos e reviews aleatórias.</p>
                </div>
            </div>
        </section>

        <hr class="divider">

        <section class="grid-section">
            <div id="posts">
                <p style="color: var(--text-secondary); font-family: var(--font-mono);">[ LOG DO SISTEMA ] Carregando registros...</p>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <div class="footer-content">
                <span class="mono-label">DIREITOS AUTORAIS &copy; 2026</span>

    <script src="js/nav_widget.js"></script>
