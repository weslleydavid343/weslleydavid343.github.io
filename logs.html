<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logs // weslley343</title>
    <script src="js/preloader.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/common/global.css">
    <link rel="stylesheet" href="css/common/theme.css">
    <link rel="stylesheet" href="css/index/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .log-hero-banner {
            position: relative;
            width: 100vw;
            left: 50%;
            right: 50%;
            margin-left: -50vw;
            margin-right: -50vw;
            min-height: 280px;
            display: flex;
            align-items: center;
            border-radius: 0;
            border-left: none;
            border-right: none;
            margin-top: 0;
            border-top: none;
            border-bottom: 1px solid var(--border-color);
            background: url('assets/20210711_163112_min_grain.webp') center/cover no-repeat;
            box-shadow: 0 8px 24px rgba(60, 45, 30, 0.12);
            overflow: hidden;
        }

        .log-hero-content {
            max-width: 960px;
            margin: 0 auto;
            padding: 0 var(--spacing-md);
            width: 100%;
        }

        @media (min-width: 768px) {
            .log-hero-content {
                padding: 0 var(--spacing-lg);
            }
        }

        .log-feed {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-lg);
            max-width: 600px;
            margin: 0 auto;
        }

        .log-entry {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: var(--spacing-md);
            font-family: var(--font-body);
            color: var(--text-primary);
        }

        .log-entry p {
            margin-bottom: var(--spacing-sm);
        }

        .log-entry p:last-child {
            margin-bottom: 0;
        }

        .log-entry ul,
        .log-entry ol {
            margin-bottom: var(--spacing-sm);
            padding-left: var(--spacing-lg);
        }

        .log-entry code {
            font-family: var(--font-mono);
            background-color: var(--background-color);
            padding: 0.1rem 0.3rem;
            border-radius: 2px;
            font-size: 0.9em;
        }

        .log-meta {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: var(--spacing-sm);
            padding-top: var(--spacing-sm);
            border-top: 1px solid var(--background-color);
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>

<body>
    <header class="site-header">
        <div class="header-container">
            <a href="index.html" style="text-decoration: none;">
                <span class="black-badge-title" style="font-size: 1.5rem; padding: 6px 20px; margin: 0;">WD343</span>
            </a>
            <nav class="desktop-nav-links">
                <a href="index.html" class="desktop-nav-btn">/INÍCIO</a>
                <a href="logs.html" class="desktop-nav-btn active">/LOGS</a>
                <a href="blog.html" class="desktop-nav-btn">/BLOG</a>
                <a href="me.html" class="desktop-nav-btn">/SOBRE</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="hero log-hero-banner">
            <div class="log-hero-content">
                <h1 class="black-badge-title">LOGS</h1>
                <div>
                    <p class="black-badge-subtitle">notas curtas de guerra...</p>
                </div>
            </div>
        </section>

        <hr class="divider">

        <section class="grid-section">
            <div id="log-feed" class="log-feed">
                <p style="color: var(--text-secondary); font-family: var(--font-mono); text-align: center;">[ LOG DO
                    SISTEMA ] Carregando registros do terminal...</p>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <div class="footer-content">
                <span class="mono-label">DIREITOS AUTORAIS &copy; 2026</span>
                <span class="mono-label">INICIATIVA: WESLLEY343</span>
            </div>
        </div>
    </footer>

    <script src="js/logs.js"></script>
    <script src="js/nav_widget.js"></script>
</body>

</html>
