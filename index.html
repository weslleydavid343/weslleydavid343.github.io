<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início // weslley343</title>
    <script src="js/preloader.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/common/global.css">
    <link rel="stylesheet" href="css/common/theme.css">
    <link rel="stylesheet" href="css/index/styles.css">
    <link rel="stylesheet" href="css/index/styles_alt.css">
</head>

<body class="home-page alt-home-page">

    <header class="site-header">
        <div class="header-container">
            <nav class="desktop-nav-links">
                <a href="index.html" class="desktop-nav-btn active">/INÍCIO</a>
                <a href="logs.html" class="desktop-nav-btn">/LOGS</a>
                <a href="blog.html" class="desktop-nav-btn">/BLOG</a>
                <a href="me.html" class="desktop-nav-btn">/SOBRE</a>
            </nav>
        </div>
    </header>

    <!-- Div de Baixo (Output Layer) -->
    <div id="output" class="output-layer">
        
        <!-- Vista Fullscreen Home (Secção 1: HOME) -->
        <div id="home-fullscreen" class="home-fullscreen-view">
            <div id="home-bg" class="home-bg-image"></div>
            <div class="home-hero-content">
                <h1 class="home-brand-title">WD343</h1>
                <p class="home-subtitle">
                    <span id="random-subtitle-text">Carregando...</span>
                </p>
                <p class="navigation-hint">
                    <span class="hint-arrow">↔</span> deslize sobre a tela para navegar
                </p>
            </div>
        </div>

        <!-- Conteiner 3D das Cartas (Secções 2, 3, 4: LOGS, BLOG, SOBRE) -->
        <div id="card-3d-scene" class="card-3d-scene hidden-card">
            <div id="output-card" class="section-card">
                <div id="slider-display" class="card-title">HOME</div>
                <div class="card-image-container">
                    <div id="output-bg-1" class="card-img-layer active"></div>
                    <div id="output-bg-2" class="card-img-layer"></div>
                </div>
                <div id="card-description" class="card-description"></div>
            </div>
        </div>

    </div>

    <!-- Div Superior (Input) com o Slider Flutuante -->
    <div id="input" class="input-layer">
        <div id="floating-slider-popup" class="floating-slider-popup hidden">
            <div class="slider-wrapper">
                <div class="slider-ticks">
                    <span class="tick"></span>
                    <span class="tick"></span>
                    <span class="tick"></span>
                    <span class="tick"></span>
                </div>
                <input type="range" id="dynamic-slider" class="popup-range-slider" min="1" max="4" value="1" step="1">
            </div>
        </div>
    </div>

    <script src="js/phrases.js"></script>
    <script src="js/index.js"></script>
    <script src="js/nav_widget.js"></script>
</body>

</html>
